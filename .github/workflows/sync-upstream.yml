name: Sync upstream GCMP

on:
  schedule:
    # GitHub Actions 不能直接监听另一个仓库的 release，故采用定时轮询。
    # 如需更快同步，可手动触发 workflow_dispatch。
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin main
          git checkout -B main FETCH_HEAD

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream main into fork main
        run: |
          set -euo pipefail

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "https://github.com/VicBilibily/GCMP.git"
          else
            git remote add upstream "https://github.com/VicBilibily/GCMP.git"
          fi

          git fetch --no-tags upstream main
          git checkout main
          git merge --no-ff --no-edit upstream/main
          git push origin main

      - name: Sync latest upstream release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const upstreamOwner = 'VicBilibily';
          const upstreamRepo = 'GCMP';
          const [forkOwner, forkRepo] = process.env.GITHUB_REPOSITORY.split('/');
          const token = process.env.GITHUB_TOKEN;

          if (!token) {
            throw new Error('GITHUB_TOKEN is required');
          }

          const apiBase = 'https://api.github.com';
          const defaultHeaders = {
            Authorization: 'Bearer ' + token,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
          };

          async function api(path, options = {}) {
            const response = await fetch(`${apiBase}${path}`, {
              ...options,
              headers: {
                ...defaultHeaders,
                ...(options.headers || {}),
              },
            });

            if (response.status === 204) {
              return null;
            }

            if (!response.ok) {
              const text = await response.text();
              const error = new Error(`GitHub API ${response.status}: ${text}`);
              error.status = response.status;
              throw error;
            }
            return response.json();
          }

          async function paginate(pathFactory) {
            const all = [];
            for (let page = 1; ; page += 1) {
              const pageData = await api(pathFactory(page));
              all.push(...pageData);
              if (pageData.length < 100) {
                break;
              }
            }
            return all;
          }

          async function getLatestPublishedRelease(owner, repo) {
            const releases = await paginate((page) => `/repos/${owner}/${repo}/releases?per_page=100&page=${page}`);
            return releases.find((release) => !release.draft) || null;
          }

          async function listAllAssets(owner, repo, releaseId) {
            return paginate((page) => `/repos/${owner}/${repo}/releases/${releaseId}/assets?per_page=100&page=${page}`);
          }

          async function ensureForkRelease(upstreamRelease) {
            try {
              const existing = await api(`/repos/${forkOwner}/${forkRepo}/releases/tags/${encodeURIComponent(upstreamRelease.tag_name)}`);
              console.log(`Release ${upstreamRelease.tag_name} already exists in fork.`);
              return { release: existing, created: false };
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            const created = await api(`/repos/${forkOwner}/${forkRepo}/releases`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                tag_name: upstreamRelease.tag_name,
                target_commitish: 'main',
                name: upstreamRelease.name || upstreamRelease.tag_name,
                body: upstreamRelease.body ?? '',
                draft: Boolean(upstreamRelease.draft),
                prerelease: Boolean(upstreamRelease.prerelease),
              }),
            });
            console.log(`Created fork release ${upstreamRelease.tag_name}.`);
            return { release: created, created: true };
          }

          async function uploadMissingAssets(upstreamRelease, forkRelease) {
            const upstreamAssets = await listAllAssets(upstreamOwner, upstreamRepo, upstreamRelease.id);
            if (upstreamAssets.length === 0) {
              console.log('Upstream release has no assets.');
              return;
            }

            const forkAssets = await listAllAssets(forkOwner, forkRepo, forkRelease.id);
            const existingNames = new Set(forkAssets.map((asset) => asset.name));
            const uploadBase = forkRelease.upload_url.replace(/\{[^}]+}$/, '');

            for (const asset of upstreamAssets) {
              if (existingNames.has(asset.name)) {
                console.log(`Asset ${asset.name} already exists in fork release, skipping.`);
                continue;
              }

              try {
                const download = await fetch(asset.browser_download_url);
                if (!download.ok) {
                  throw new Error(`download failed with status ${download.status}`);
                }

                const assetData = Buffer.from(await download.arrayBuffer());
                const uploadUrl = `${uploadBase}?name=${encodeURIComponent(asset.name)}`;
                const uploadResponse = await fetch(uploadUrl, {
                  method: 'POST',
                  headers: {
                    Authorization: 'Bearer ' + token,
                    Accept: 'application/vnd.github+json',
                    'X-GitHub-Api-Version': '2022-11-28',
                    'Content-Type': asset.content_type || 'application/octet-stream',
                    'Content-Length': String(assetData.length),
                  },
                  body: assetData,
                });

                if (!uploadResponse.ok) {
                  const text = await uploadResponse.text();
                  throw new Error(`upload failed with status ${uploadResponse.status}: ${text}`);
                }

                console.log(`Uploaded asset ${asset.name}.`);
              } catch (error) {
                console.warn(`Failed to sync asset ${asset.name}: ${error.message}`);
              }
            }
          }

          const latestUpstream = await getLatestPublishedRelease(upstreamOwner, upstreamRepo);
          if (!latestUpstream) {
            console.log('No published upstream release found; skipping release sync.');
            process.exit(0);
          }

          console.log(`Latest upstream release: ${latestUpstream.tag_name}`);
          const { release: forkRelease, created } = await ensureForkRelease(latestUpstream);
          await uploadMissingAssets(latestUpstream, forkRelease);

          if (!created) {
            console.log('Release already existed; assets were checked for idempotent sync.');
          }
          NODE
