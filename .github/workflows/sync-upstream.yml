name: Sync upstream GCMP

on:
  schedule:
    # GitHub Actions 不能直接监听另一个仓库的 release，故采用定时轮询。
    # 如需更快同步，可手动触发 workflow_dispatch。
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream main into fork main
        run: |
          set -euo pipefail

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "https://github.com/VicBilibily/GCMP.git"
          else
            git remote add upstream "https://github.com/VicBilibily/GCMP.git"
          fi

          git fetch --no-tags upstream main
          git checkout main
          git merge --no-ff --no-edit upstream/main
          git push origin main

      - name: Sync latest upstream release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const upstreamOwner = 'VicBilibily';
            const upstreamRepo = 'GCMP';
            const { owner: forkOwner, repo: forkRepo } = context.repo;

            async function getLatestPublishedRelease(owner, repo) {
              for await (const page of github.paginate.iterator(github.rest.repos.listReleases, {
                owner,
                repo,
                per_page: 100,
              })) {
                for (const release of page.data) {
                  if (!release.draft) {
                    return release;
                  }
                }
              }
              return null;
            }

            async function listAllAssets(owner, repo, releaseId) {
              return github.paginate(github.rest.repos.listReleaseAssets, {
                owner,
                repo,
                release_id: releaseId,
                per_page: 100,
              });
            }

            async function ensureForkRelease(upstreamRelease) {
              try {
                const existing = await github.rest.repos.getReleaseByTag({
                  owner: forkOwner,
                  repo: forkRepo,
                  tag: upstreamRelease.tag_name,
                });
                core.info(`Release ${upstreamRelease.tag_name} already exists in fork.`);
                return { release: existing.data, created: false };
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }

              const created = await github.rest.repos.createRelease({
                owner: forkOwner,
                repo: forkRepo,
                tag_name: upstreamRelease.tag_name,
                target_commitish: 'main',
                name: upstreamRelease.name || upstreamRelease.tag_name,
                body: upstreamRelease.body ?? '',
                draft: Boolean(upstreamRelease.draft),
                prerelease: Boolean(upstreamRelease.prerelease),
              });
              core.info(`Created fork release ${upstreamRelease.tag_name}.`);
              return { release: created.data, created: true };
            }

            async function uploadMissingAssets(upstreamRelease, forkRelease) {
              const upstreamAssets = await listAllAssets(upstreamOwner, upstreamRepo, upstreamRelease.id);
              if (upstreamAssets.length === 0) {
                core.info('Upstream release has no assets.');
                return;
              }

              const forkAssets = await listAllAssets(forkOwner, forkRepo, forkRelease.id);
              const existingNames = new Set(forkAssets.map((asset) => asset.name));

              for (const asset of upstreamAssets) {
                if (existingNames.has(asset.name)) {
                  core.info(`Asset ${asset.name} already exists in fork release, skipping.`);
                  continue;
                }

                try {
                  const response = await fetch(asset.browser_download_url);
                  if (!response.ok) {
                    throw new Error(`download failed with status ${response.status}`);
                  }

                  const assetData = Buffer.from(await response.arrayBuffer());
                  await github.request('POST /repos/{owner}/{repo}/releases/{release_id}/assets?name={name}', {
                    owner: forkOwner,
                    repo: forkRepo,
                    release_id: forkRelease.id,
                    name: asset.name,
                    data: assetData,
                    headers: {
                      'content-type': asset.content_type || 'application/octet-stream',
                      'content-length': String(assetData.length),
                    },
                  });
                  core.info(`Uploaded asset ${asset.name}.`);
                } catch (error) {
                  core.warning(`Failed to sync asset ${asset.name}: ${error.message}`);
                }
              }
            }

            try {
              const latestUpstream = await getLatestPublishedRelease(upstreamOwner, upstreamRepo);
              if (!latestUpstream) {
                core.info('No published upstream release found; skipping release sync.');
                return;
              }

              core.info(`Latest upstream release: ${latestUpstream.tag_name}`);
              const { release: forkRelease, created } = await ensureForkRelease(latestUpstream);
              await uploadMissingAssets(latestUpstream, forkRelease);

              if (!created) {
                core.info('Release already existed; assets were checked for idempotent sync.');
              }
            } catch (error) {
              core.setFailed(`Release sync failed: ${error.message}`);
            }
